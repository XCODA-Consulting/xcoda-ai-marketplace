name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill:
          - plugins/dod-architect/skills/dod-architect
          - plugins/plan-architect/skills/plan-architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ${{ matrix.skill }} tests
        working-directory: ${{ matrix.skill }}
        run: python -m unittest discover -s tests -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plugin manifests parse
        run: >-
          python -c "import json, glob;
          paths = glob.glob('.claude-plugin/*.json') + glob.glob('plugins/*/.claude-plugin/*.json');
          [json.load(open(p)) for p in paths];
          print(f'{len(paths)} manifests OK')"
